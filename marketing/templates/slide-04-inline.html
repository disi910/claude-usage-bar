<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="shared.css">
<style>
  body { width: 1280px; height: 800px; }
  .headwrap { position: absolute; top: 88px; left: 0; right: 0; text-align: center; }
  .headwrap .kicker { margin-bottom: 18px; }
  .headwrap h1 { margin-bottom: 16px; }
  .headwrap .sub { max-width: 620px; margin: 0 auto; }
  .seg { display: flex; gap: 0; margin: 30px auto 0; width: fit-content;
         border: 1px solid var(--hair); border-radius: 10px; overflow: hidden; font-size: 14px; }
  .seg span { padding: 9px 22px; color: var(--muted); background: rgba(48,48,46,.6); }
  .seg span.on { background: var(--coral); color: #1F1B14; font-weight: 600; }
  .stage { position: absolute; left: 50%; transform: translateX(-50%); top: 428px; }
  .composer { width: 860px; padding: 22px 26px 18px; box-shadow: 0 40px 110px rgba(0,0,0,.55), 0 0 70px rgba(217,119,87,.10); }
  .ubar.inline .pct { font-size: 14px; }
  .composer .ph { font-size: 18px; }
  .caret { display: inline-block; width: 2px; height: 22px; background: var(--cream); vertical-align: middle; margin-left: 2px; }
</style></head>
<body>
  <div class="bg"><div class="glow"></div><div class="grid"></div><div class="vignette"></div></div>

  <div class="headwrap">
    <div class="kicker">Two positions</div>
    <h1 class="head">Right inside the chat box</h1>
    <div class="sub">Keep the bar where you already look while you type. Or pin it to the top of the page. Your call, one click away.</div>
    <div class="seg"><span>Top of page</span><span class="on">In chat box</span></div>
  </div>

  <div class="stage">
    <div class="composer">
      <div class="ubar inline">
        <span class="pct">62 %</span>
        <span class="track"><span class="fill" style="width:62%"></span></span>
        <span class="reset">resets in 2h 14m</span>
        <svg width="20" height="20" viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="none" stroke="rgba(245,244,238,.18)" stroke-width="7"/><circle cx="20" cy="20" r="15" fill="none" stroke="#D97757" stroke-width="7" stroke-linecap="round" stroke-dasharray="17.9 94.25" transform="rotate(-90 20 20)"/></svg>
        <span class="pct" style="font-size:12.5px">19%</span>
      </div>
      <div class="ph">Write a message<span class="caret"></span></div>
      <div class="row">
        <span class="plus">+</span>
        <span class="model"><b>Sonnet 5</b> Medium
          <svg width="14" height="16" viewBox="0 0 14 16" fill="none" stroke="#B8B0A2" stroke-width="1.4" stroke-linecap="round"><rect x="4.5" y="1" width="5" height="8.4" rx="2.5"/><path d="M1.8 7.4a5.2 5.2 0 0 0 10.4 0M7 12.8v2.4"/></svg>
        </span>
      </div>
    </div>
  </div>
</body></html>
